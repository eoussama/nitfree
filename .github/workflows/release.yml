name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  zip:
    name: Zip Chrome, Edge and Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm wxt zip -b chrome
      - run: pnpm wxt zip -b edge
      - run: pnpm wxt zip -b firefox
      - uses: actions/upload-artifact@v7
        with:
          name: zips
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: GitHub release
    needs: [zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

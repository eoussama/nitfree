  shortcutChange: Change
  shortcutReset: Reset
  shortcutRecording: Press the keys…
  shortcutModifier: Hold Ctrl or Alt with the key.
  shortcutModifierMac: Hold ⌘, ⌥ or ⌃ with the key.

    new: New pack
    hint: Group items into packs, each a section of the panel that its name also finds, and share them as one .nitfree file each. An item can be in several packs.
    create: Create pack
    created: "Created “{name}”."
    list: Your packs
    listHint: Pick a pack to rename, delete or export it. Items join packs from their edit dialog.
    none: No packs yet.
    rename: Rename
    renamed: "Renamed to “{name}”."
    deleted: "Deleted “{name}”."
    confirmTitle: "Delete “{name}”"
    confirm: The pack is deleted, and its items stay in your library.
    confirmDelete: Delete pack
    icon: Icon
    iconHint: Shows the pack in the panel's sidebar. Until you pick one, it is the pack's newest item.

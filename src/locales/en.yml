locale: en
extName: Nitfree
extDescription: The definitive freemium Discord Nitro alternative
popup:
  logo: Nitfree logo
  version: Version {version}
  back: Back
  pages: More
  github: View Nitfree on GitHub
  library: Library
  items:
    1: 1 item
    n: $1 items
  failed: "Could not do that: {error}"
  storage:
    heading: Storage
    usage: Space used
    usedOf: "{used} used of {quota} available."
    used: "{used} used."
    cached: Cached copies
    cachedHint: Smaller copies made for the grid and for sending. Clearing them keeps your files, and they are made again when needed.
    clearCache: Clear cache
    cleared: "Freed {size}."
    largest: Largest items
    largestHint: Select the items you no longer need to delete them.
    delete:
      1: Delete 1 item
      n: Delete $1 items
    confirm: Their files are deleted from your library for good. This cannot be undone.
    deleted: "Deleted {items}."
    persistTitle: Persistent storage
    persist: Keep my library safe
    persistHint: Without this, the browser may clear your library when the disk runs low on space.
    persistDenied: The browser did not allow it. It decides by how you use it, so try again later.
    persisted: The browser will keep your library, even when the disk runs low on space.
  duplicates:
    heading: Duplicates
    hint: Items that show the same picture, as the same file or a resized or converted copy. Keep one of each, and it takes the others' tags, packs, favorite and sends before they are deleted.
    searching: Looking for duplicates…
    none: No duplicates in your library.
    exact:
      1: 1 identical file
      n: $1 identical files
    similar:
      1: 1 similar image
      n: $1 similar images
    details: "{width} × {height}, {size}"
    keep: Keep selected
    confirmTitle: "Keep “{title}”"
    confirm:
      1: The other item is deleted from your library for good, once its tags, packs, favorite and sends are moved over. This cannot be undone.
      n: The $1 other items are deleted from your library for good, once their tags, packs, favorite and sends are moved over. This cannot be undone.
    confirmMerge: Keep and delete others
    merged: "Kept “{title}” and deleted {items}."
  packs:
    new: New pack
    hint: Group items into packs, each a section of the panel that its name also finds, and share them as one .nitfree file each. An item can be in several packs.
    create: Create pack
    created: "Created “{name}”."
    list: Your packs
    listHint: Pick a pack to rename, delete or export it. Items join packs from their edit dialog.
    none: No packs yet.
    rename: Rename
    renamed: "Renamed to “{name}”."
    deleted: "Deleted “{name}”."
    confirmTitle: "Delete “{name}”"
    confirm: The pack is deleted, and its items stay in your library.
    confirmDelete: Delete pack
    icon: Icon
    iconHint: Shows the pack in the panel's sidebar. Until you pick one, it is the pack's newest item.
  themes:
    heading: Themes
    colors: Color themes
    colorsHint: A gradient behind Discord, with its colors blended into Discord's surfaces and text, as Nitro's color themes do. The light ones suit Discord's light theme, the dark ones its dark themes.
    default: Discord's default
    names:
      peach: Peach Fizz
      mint: Mint Breeze
      lavender: Lavender Haze
      lemon: Lemon Sorbet
      cotton: Cotton Sky
      seaglass: Sea Glass
      ocean: Deep Ocean
      ember: Ember
      nebula: Nebula
      aurora: Aurora
      rose: Midnight Rose
      forest: Forest Floor
      synthwave: Synthwave
      graphite: Graphite Gold
    accent: Use my own accent color
    accentHint: Replaces Discord's blurple on its buttons, switches and highlights, in every Discord tab. Nitfree's panel follows it.
    accentColor: Accent color
    pickColor: Pick a color
    snippets: CSS snippets
    snippetsHint: CSS added on top of Discord's own styles, in every Discord tab. Turn each one on or off; changes apply at once.
    none: No snippets yet.
    new: New snippet
    untitled: Untitled snippet
    edit: "Edit {name}"
    css: CSS
    cssHint: Applies as you type. Add !important where Discord's own rules still win.
    done: Done
    confirmTitle: "Delete the snippet “{name}”"
    confirm: Its CSS is taken out of Discord and the snippet is deleted. This cannot be undone.
    confirmDelete: Delete snippet
  add: Quick add
  drop: Drop or paste images here, or pick them.
  settings: Settings
  sizes: Sending sizes
  sizesHint: The longest side, in pixels. Discord shows emojis at 48 and stickers at 160.
  click: A click on an item
  clickSend: Sends it
  clickAdd: Adds it to the message
  clickHint: Shift+click does the other.
  animations: Play animated items on hover
  autocomplete: Suggest items while typing
  suggestionsAt: Place suggestions
  suggestionsAtEnd: After Discord's emojis
  suggestionsAtStart: Before Discord's emojis
  autocompleteHint: "Typing :name in a message adds your matching items to Discord's suggestions. The arrow keys reach them past Discord's own; Tab adds one without sending."
  shortcut: Open Nitfree with a shortcut
  shortcutHint: Pressing it in a channel opens Nitfree, ready to search. Pressing it again closes it.
  shortcutKeys: Shortcut
  shortcutChange: Change
  shortcutReset: Reset
  shortcutRecording: Press the keys…
  shortcutModifier: Hold Ctrl or Alt with the key.
  shortcutModifierMac: Hold ⌘, ⌥ or ⌃ with the key.
  transfer:
    heading: Backup
    exportTitle: Export
    export: Export library
    exportSettings: Include settings
    exportHint: Saves every item, tag, pack and favorite as one .nitfree file.
    import: Import file
    importFolder: Import folder
    importHint: A .nitfree backup, or a zip or folder of images, where folder names become tags.
    reading: Reading the file…
    importing: "Importing {done} of {total}"
    tags:
      1: 1 tag
      n: $1 tags
    summary: "{items}, {tags}, {size}"
    packs: "Packs: {names}"
    images: Plain images. Folder names become tags and file names become titles.
    ignored:
      1: 1 file that is not a supported image is left out.
      n: $1 files that are not supported images are left out.
    mode: How to import
    merge: Add to my library
    mergeHint: Files that are already in it are skipped.
    replace: Replace my library
    replaceHint: Everything in it is deleted first.
    withSettings: Also apply the settings in this file
    start: Import
    imported: "Added {added}, skipped {skipped} already in your library."
    failed: "{failed} could not be added."

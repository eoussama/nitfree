minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "@eoussama/core@0.1.2"
  - "@eoussama/dx@0.1.3"

trustPolicy: no-downgrade
# chokidar 4.0.2 and 4.0.3 were published without the provenance 4.0.1 had; svelte-check needs ^4.
trustPolicyExclude:
  - chokidar@4.0.3

shellEmulator: true

# KaTeX is only reached through the linter's Markdown support; 0.18.2 fixes its prototype pollution.
# qs is only reached through Stryker's dashboard client, which pins 6.15.1; 6.16.0 fixes its denial of service.
# fast-uri is only reached through the linter behind WXT's web-ext; 3.1.9 fixes its URI parsing flaws.
overrides:
  fast-uri: ">=3.1.9"

  katex: ">=0.18.2"
  qs: ">=6.16.0"

auditConfig:
  ignoreGhsas:
    # node-forge has no patched release. It is only reached through web-ext's Android debugging
    # (adbkit), a build-time tool that never ships in the extension and never verifies RSA signatures.
    - GHSA-86w9-cpqp-85rv

patchedDependencies:
  # Vitest 5 matches test names joined with " > ", which Stryker's runner joins with spaces, so no
  # test ran against a mutant. Drop the patch once the runner names tests the way Vitest does.
  "@stryker-mutator/vitest-runner": patches/@stryker-mutator__vitest-runner.patch
